<form>
  <label for="nome">Nome</label><input id="nome" type="text">
  <label for="sobrenome">Sobrenome</label><input id="sobrenome" type="text">
  <label for="em">E-mail</label><input id="em" type="text">
  <label for="cid">Cidade</label><input id="cid" type="text">
  <label for="tel">Telefone</label><input id="tel" type="text">
  <label for="sal">Pretensão salarial (R$, mensal)</label><input id="sal" type="text">
  <label for="cv">Currículo</label><input id="cv" type="file">
  <label for="carta">Carta de apresentação</label><input id="carta" type="file">
  <label for="sobre">Fale sobre você (até 500 caracteres)</label><textarea id="sobre"></textarea>
  <fieldset><legend>Você precisa de visto?</legend>
    <label><input type="radio" name="visto" value="Sim"> Sim</label>
    <label><input type="radio" name="visto" value="Não"> Não</label>
  </fieldset>
  <label><input type="checkbox" name="lgpd"> Concordo com a política de privacidade</label>
</form>
