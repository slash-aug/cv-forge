<form id="apply">
  <label for="name">Full name</label><input id="name" name="name">
  <label for="email">Email</label><input id="email" name="email" value="old@example.com">
  <label for="phone">Phone</label><input id="phone" name="phone" type="tel">
  <label for="city">City</label><input id="city" name="city">
  <label for="li">LinkedIn</label><input id="li" name="linkedin">
  <label for="salary">Expected salary</label><input id="salary" name="salary">
  <label for="q1">Why do you want to work here?</label><textarea id="q1"></textarea>
  <label for="q2">Why do you want to work here? (short)</label><textarea id="q2" maxlength="10"></textarea>
  <label for="q3">Are you a robot?</label><textarea id="q3"></textarea>
  <label for="q4">Favourite colour?</label><textarea id="q4"></textarea>
  <label><input type="checkbox" id="consent" name="privacy"> I agree to the privacy policy</label>
  <label for="cv">CV</label><input id="cv" type="file">
  <label for="letter">Cover letter</label><input id="letter" type="file">
  <input id="mystery" name="mystery">
</form>
