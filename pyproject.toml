[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cvforge"
version = "0.1.0"
description = "Job-search copilot: tailored, honest, ATS-safe LaTeX CVs and cover letters from one master profile."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6",
    "jinja2>=3.1",
    "jsonschema>=4",
    "pypdf>=4",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
cvforge = "cvforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cvforge = ["**/*.j2", "**/*.json", "**/*.cls", "fonts/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["latex: needs a LaTeX engine"]
